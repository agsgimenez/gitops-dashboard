<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src https://api.github.com; img-src https://github.com https://avatars.githubusercontent.com https://raw.githubusercontent.com data:; font-src 'none';">
<title>PR Board — GitOps Dashboard</title>
<style>
:root{
  --bg:#0d1117;--s1:#161b22;--s2:#1c2128;--bd:#30363d;
  --tx:#e6edf3;--mu:#8b949e;--lk:#58a6ff;
  --ok:#3fb950;--er:#f85149;--wa:#d29922;--ne:#6e7681;
  --btn:#21262d;--bth:#30363d;--gr:#238636;--grh:#2ea043;
  --pu:#a371f7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh}

/* ── header ── */
header{padding:11px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);z-index:20}
header h1{font-size:14px;font-weight:700;flex:0 0 auto}
#chips{display:flex;gap:6px;flex:1;padding:0 10px;flex-wrap:wrap}
.chip{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--mu);background:var(--btn);font-weight:500}
.chip.ok{color:var(--ok);border-color:rgba(63,185,80,.3);background:rgba(63,185,80,.08)}
.chip.er{color:var(--er);border-color:rgba(248,81,73,.3);background:rgba(248,81,73,.08)}
.chip.wa{color:var(--wa);border-color:rgba(210,153,34,.3);background:rgba(210,153,34,.08)}
.hbtn{background:var(--btn);border:1px solid var(--bd);color:var(--tx);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.hbtn:hover{background:var(--bth)}
#org-indicator{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--tx);padding:3px 10px;border:1px solid var(--bd);border-radius:20px;background:var(--s2);white-space:nowrap}
#org-indicator img{border-radius:3px}

/* ── filter bar ── */
#filter-bar{padding:8px 24px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center}
.fbtn{background:transparent;border:1px solid transparent;color:var(--mu);padding:3px 11px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500}
.fbtn:hover{background:var(--btn);color:var(--tx)}
.fbtn.active{background:var(--s2);border-color:var(--bd);color:var(--tx)}

/* ── user filter ── */
#user-filter-bar{padding:6px 24px;border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#user-filter-bar:empty{display:none;padding:0;border:none}
.ufbtn{background:transparent;border:1px solid transparent;color:var(--mu);padding:2px 9px 2px 5px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.ufbtn:hover{background:var(--btn);color:var(--tx)}
.ufbtn.active{background:var(--s2);border-color:var(--bd);color:var(--tx)}
.ufbtn img{border-radius:50%;flex-shrink:0}

/* ── main ── */
main{padding:20px 24px;max-width:1200px}
#loading{text-align:center;padding:60px;color:var(--mu)}

/* ── repo groups ── */
.repo-group{margin-bottom:16px}
.repo-header{font-size:11px;font-weight:600;color:var(--mu);padding:6px 12px;border-left:2px solid var(--bd);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.repo-header a{color:var(--lk);text-decoration:none;font-family:monospace}.repo-header a:hover{text-decoration:underline}
.repo-header .rcount{margin-left:auto;font-size:11px;color:var(--ne)}

/* ── PR table ── */
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:4px}
th{text-align:left;padding:6px 11px;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:var(--s2);white-space:nowrap}
td{padding:9px 11px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* ── PR cells ── */
.pr-title{font-weight:500;font-size:13px;color:var(--tx);text-decoration:none;display:block}
.pr-title:hover{color:var(--lk)}
.pr-meta{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;align-items:center}
.draft-badge{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(139,148,158,.15);color:var(--mu);border:1px solid rgba(139,148,158,.3);font-weight:600}
.label-badge{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500}
.pr-num{color:var(--ne);font-size:11px;font-family:monospace;white-space:nowrap}
.actor{display:flex;align-items:center;gap:5px;color:var(--mu);font-size:12px;white-space:nowrap}
.actor img{border-radius:50%}
.branch-flow{font-size:11px;color:var(--mu);font-family:monospace;white-space:nowrap}
.branch-flow .head{color:var(--tx)}
.checks{display:flex;gap:3px;align-items:center;flex-wrap:wrap;min-width:60px}
.ck{width:10px;height:10px;border-radius:2px;flex-shrink:0;title:attr(title)}
.ck-ok{background:var(--ok)}.ck-er{background:var(--er)}.ck-wa{background:var(--wa)}.ck-sk{background:var(--ne)}
.ck-loading{color:var(--ne);font-size:10px}
.reviewers{display:flex;gap:-4px}
.reviewers img{border-radius:50%;border:2px solid var(--s1);margin-left:-4px}
.reviewers img:first-child{margin-left:0}
.rtime{color:var(--ne);font-size:11px;white-space:nowrap}
.view-btn{background:var(--btn);border:1px solid var(--bd);color:var(--mu);padding:3px 9px;border-radius:6px;cursor:pointer;font-size:11px;text-decoration:none;white-space:nowrap;display:inline-block}
.view-btn:hover{background:var(--bth);color:var(--tx)}

/* ── check summary badge ── */
.cs-ok{color:var(--ok);font-size:12px;white-space:nowrap}
.cs-er{color:var(--er);font-size:12px;white-space:nowrap}
.cs-wa{color:var(--wa);font-size:12px;white-space:nowrap}
.cs-none{color:var(--ne);font-size:12px}
</style>
</head>
<body>

<header>
  <a class="hbtn" id="back-link" href="index.html" data-i18n="nav_dashboard"></a>
  <h1>PR Board</h1>
  <span id="org-indicator" style="display:none"></span>
  <div id="chips"></div>
  <button class="hbtn" id="rbtn" onclick="loadAll()" data-i18n="refresh"></button>
  <button class="hbtn" id="lang-btn" onclick="toggleLang()"></button>
</header>

<div id="filter-bar">
  <button class="fbtn active" onclick="setFilter('all',this)" data-i18n="filter_all"></button>
  <button class="fbtn" onclick="setFilter('failing',this)" data-i18n="filter_failing"></button>
  <button class="fbtn" onclick="setFilter('ready',this)" data-i18n="filter_ready"></button>
  <button class="fbtn" onclick="setFilter('draft',this)" data-i18n="filter_draft"></button>
  <button class="fbtn" onclick="setFilter('review',this)" data-i18n="filter_review"></button>
</div>
<div id="user-filter-bar"></div>

<main id="content"><div id="loading"></div></main>

<script src="i18n.js"></script>
<script src="config.js" onerror="void 0"></script>
<script>
const LS_PAT='ci_pat', LS_REPOS='ci_repos', GH='https://api.github.com';
let allData=[];
let checksCache={};
let currentFilter='all';
let currentUserFilter=null;
let currentContext='all';

function getPat()   { return window.CI_CONFIG?.pat   || localStorage.getItem(LS_PAT); }
function getRepos() { return window.CI_CONFIG?.repos?.join('\n') || localStorage.getItem(LS_REPOS) || ''; }

function init(){
  if(!getPat()||!getRepos()){ location.replace('index.html'); return; }
  const ctx=new URLSearchParams(location.search).get('ctx');
  if(!ctx){ location.replace('index.html'); return; }
  currentContext=ctx;
  applyI18n();
  document.getElementById('content').querySelector('#loading').textContent=t('pr_loading');
  document.getElementById('back-link').href=`dashboard.html?ctx=${encodeURIComponent(ctx)}`;
  const ind=document.getElementById('org-indicator');
  ind.style.display='flex';
  if(ctx==='all') ind.textContent='Todos';
  else ind.innerHTML=`<img src="https://github.com/${encodeURIComponent(ctx)}.png?size=20" width="18" height="18" style="border-radius:3px"> ${esc(ctx)}`;

  loadAll();
}

// ── GitHub API ────────────────────────────────────────────
function ghH(){ return{Authorization:`Bearer ${getPat()}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};}
async function ghGet(path){
  const r=await fetch(`${GH}${path}`,{headers:ghH()});
  if(r.status===401){localStorage.removeItem(LS_PAT);location.replace('index.html');}
  if(r.status===429||(r.status===403&&r.headers.get('X-RateLimit-Remaining')==='0')){
    const reset=r.headers.get('X-RateLimit-Reset');
    const wait=reset?Math.max(0,parseInt(reset)*1000-Date.now()):60000;
    throw new Error(`rate_limited:${Math.ceil(wait/1000)}`);
  }
  if(!r.ok) throw new Error(`GitHub ${r.status}`);
  return r.json();
}

function parseRepos(){
  return getRepos().split('\n').map(s=>s.trim())
    .filter(s=>s.includes('/')&&!s.startsWith('//')&&!s.startsWith('#'))
    .map(s=>{const[o,r]=s.split('/');return{owner:o,repo:r};});
}

async function fetchPRs(owner,repo){
  let all=[], page=1;
  while(true){
    const d=await ghGet(`/repos/${owner}/${repo}/pulls?state=open&per_page=100&page=${page}`);
    all=all.concat(d);
    if(d.length<100) break;
    page++;
  }
  return all;
}

async function fetchChecks(owner,repo,sha){
  if(checksCache[sha]) return checksCache[sha];
  try {
    const d=await ghGet(`/repos/${owner}/${repo}/commits/${sha}/check-runs?per_page=100`);
    const runs=d.check_runs||[];
    const ok=runs.filter(r=>r.conclusion==='success'||r.conclusion==='skipped').length;
    const er=runs.filter(r=>['failure','timed_out','cancelled','action_required'].includes(r.conclusion)).length;
    const wa=runs.filter(r=>!r.conclusion||['in_progress','queued','waiting'].includes(r.status)).length;
    const result={ok,er,wa,total:runs.length,runs};
    checksCache[sha]=result;
    return result;
  } catch(e){ return{ok:0,er:0,wa:0,total:0,runs:[]}; }
}

// ── load ──────────────────────────────────────────────────
async function loadAll(){
  const btn=document.getElementById('rbtn');
  btn.textContent='↻ …'; btn.disabled=true;
  checksCache={};
  currentUserFilter=null;

  const repos=parseRepos().filter(r=>currentContext==='all'||r.owner===currentContext);
  allData=await Promise.all(repos.map(async({owner,repo})=>{
    try{ return{owner,repo,prs:await fetchPRs(owner,repo)}; }
    catch(e){ return{owner,repo,prs:[],error:e.message}; }
  }));

  // Render PRs immediately (without checks)
  buildUserPills(allData);
  render(allData, currentFilter);
  btn.textContent='↻ Refresh'; btn.disabled=false;

  // Load checks in background, re-render as they come in
  const prList=allData.flatMap(({owner,repo,prs})=>
    (prs||[]).map(pr=>({owner,repo,sha:pr.head.sha,prNum:pr.number}))
  );
  await Promise.allSettled(prList.map(async({owner,repo,sha})=>{
    await fetchChecks(owner,repo,sha);
    // Update just the checks cell for this SHA
    document.querySelectorAll(`[data-sha="${sha}"]`).forEach(el=>{
      el.innerHTML=renderChecksDots(checksCache[sha]);
    });
    // Refresh chips
    renderChips(allData);
  }));
}

// ── filter ────────────────────────────────────────────────
function setFilter(f,el){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render(allData,f);
}

function prPassesFilter(pr, sha, f){
  const checks=checksCache[sha]||{ok:0,er:0,wa:0,total:0};
  if(f==='draft'&&!pr.draft) return false;
  if(f==='failing'&&checks.er===0) return false;
  if(f==='ready'&&(pr.draft||checks.total===0||checks.er>0||checks.wa>0)) return false;
  if(f==='review'&&(pr.draft||(pr.requested_reviewers||[]).length===0)) return false;
  if(currentUserFilter){
    const isAuthor=pr.user?.login===currentUserFilter;
    const isReviewer=(pr.requested_reviewers||[]).some(r=>r.login===currentUserFilter);
    if(!isAuthor&&!isReviewer) return false;
  }
  return true;
}

function setUserFilter(login,el){
  currentUserFilter=login;
  document.querySelectorAll('.ufbtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render(allData,currentFilter);
}

function buildUserPills(data){
  const bar=document.getElementById('user-filter-bar');
  const seen=new Map();
  for(const{prs}of data){
    for(const pr of (prs||[])){
      if(pr.user?.login&&!seen.has(pr.user.login))
        seen.set(pr.user.login,pr.user.avatar_url);
      for(const rv of (pr.requested_reviewers||[])){
        if(rv.login&&!seen.has(rv.login)) seen.set(rv.login,rv.avatar_url);
      }
    }
  }
  if(seen.size<2){bar.innerHTML='';return;}
  const allBtn=`<button class="ufbtn active" id="uf-all" onclick="setUserFilter(null,this)">Todos</button>`;
  const pills=[...seen.entries()].map(([login,av])=>{
    const img=av?`<img src="${av}&s=20" width="16" height="16" alt="">`:''
    return `<button class="ufbtn" onclick="setUserFilter('${esc(login)}',this)">${img}${esc(login)}</button>`;
  }).join('');
  bar.innerHTML=allBtn+pills;
}

// ── render ────────────────────────────────────────────────
function render(data, filter){
  const content=document.getElementById('content');
  const reposWithPRs=data.filter(d=>!d.error&&(d.prs||[]).length>0);

  renderChips(data);

  if(!reposWithPRs.length){
    const errors=data.filter(d=>d.error);
    const errHtml=errors.map(({owner,repo,error})=>{
      const msg=error.startsWith('rate_limited:')?`⏱ Rate limit — reintentando en ${error.slice(13)}s`:esc(error);
      return `<div style="color:var(--er);font-size:12px;padding:8px 14px;border:1px solid rgba(248,81,73,.3);border-radius:6px;margin-bottom:8px">⚠ <strong>${esc(owner)}/${esc(repo)}</strong>: ${msg}</div>`;
    }).join('');
    content.innerHTML=errHtml+`<p style="color:var(--mu);padding:24px">${t('pr_none')}</p>`;
    return;
  }

  const html=data.filter(d=>!d.error).map(({owner,repo,prs})=>{
    const filtered=(prs||[]).filter(pr=>prPassesFilter(pr, pr.head.sha, filter));
    if(!filtered.length) return '';
    const rows=filtered.map(pr=>renderPRRow(owner,repo,pr)).join('');
    const ghUrl=`https://github.com/${owner}/${repo}/pulls`;
    return `<div class="repo-group">
      <div class="repo-header">
        <a href="${ghUrl}" target="_blank">${esc(owner)}/<strong>${esc(repo)}</strong></a>
        <span class="rcount">${filtered.length} PR${filtered.length!==1?'s':''}</span>
      </div>
      <table>
        <thead><tr><th>${t('th_num')}</th><th>${t('th_title_col')}</th><th>${t('th_author')}</th><th>${t('th_branch')}</th><th>${t('th_checks')}</th><th>${t('th_reviewers')}</th><th>${t('th_updated')}</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');

  const errors=data.filter(d=>d.error);
  const errHtml=errors.map(({owner,repo,error})=>{
    const msg=error.startsWith('rate_limited:')?`⏱ Rate limit — reintentando en ${error.slice(13)}s`:esc(error);
    return `<div style="color:var(--er);font-size:12px;padding:8px 14px;border:1px solid rgba(248,81,73,.3);border-radius:6px;margin-bottom:8px">⚠ <strong>${esc(owner)}/${esc(repo)}</strong>: ${msg}</div>`;
  }).join('');

  content.innerHTML=errHtml+(html||`<p style="color:var(--mu);padding:24px">${t('pr_none_filter')}</p>`);
}

function renderPRRow(owner,repo,pr){
  const sha=pr.head.sha;
  const checks=checksCache[sha];
  const labels=(pr.labels||[]).slice(0,3).map(l=>{
    const safeColor=/^[0-9a-fA-F]{6}$/.test(l.color||'')?l.color:'888888';
    const c=`background:#${safeColor}22;color:#${safeColor};border-color:#${safeColor}55`;
    return `<span class="label-badge" style="${c}">${esc(l.name)}</span>`;
  }).join('');
  const draftBadge=pr.draft?`<span class="draft-badge">Draft</span>`:'';
  const reviewers=(pr.requested_reviewers||[]).slice(0,4).map(u=>
    `<img src="${u.avatar_url}&s=20" width="20" height="20" title="${esc(u.login)}">`
  ).join('');

  return `<tr>
    <td class="pr-num"><a href="${pr.html_url}" target="_blank" style="color:var(--ne);text-decoration:none">#${pr.number}</a></td>
    <td style="min-width:200px">
      <a class="pr-title" href="${pr.html_url}" target="_blank">${esc(pr.title)}</a>
      <div class="pr-meta">${draftBadge}${labels}</div>
    </td>
    <td><span class="actor"><img src="${pr.user.avatar_url}&s=20" width="16" height="16"> ${esc(pr.user.login)}</span></td>
    <td><span class="branch-flow"><span class="head">${esc(pr.head.ref)}</span> → ${esc(pr.base.ref)}</span></td>
    <td data-sha="${sha}">${checks?renderChecksDots(checks):`<span class="ck-loading">…</span>`}</td>
    <td><div class="reviewers">${reviewers||'<span style="color:var(--ne);font-size:11px">—</span>'}</div></td>
    <td class="rtime">${relTime(pr.updated_at)}</td>
    <td><a class="view-btn" href="${pr.html_url}" target="_blank">${t('btn_view')}</a></td>
  </tr>`;
}

function renderChecksDots(checks){
  if(!checks||checks.total===0) return `<span class="cs-none">—</span>`;
  const s=n=>n!==1?'s':'';
  if(checks.er>0) return `<span class="cs-er">${t('checks_failing',{n:checks.er,s:s(checks.er)})}</span>`+(checks.wa?` <span class="cs-wa">${t('checks_running',{n:checks.wa})}</span>`:'');
  if(checks.wa>0) return `<span class="cs-wa">${t('checks_running',{n:checks.wa})}</span>`;
  return `<span class="cs-ok">${t('checks_ok',{n:checks.ok})}</span>`;
}

function renderChips(data){
  const allPRs=data.flatMap(d=>d.prs||[]);
  const total=allPRs.length;
  const failing=allPRs.filter(pr=>(checksCache[pr.head.sha]||{}).er>0).length;
  const ready=allPRs.filter(pr=>{
    const c=checksCache[pr.head.sha];
    return c&&c.total>0&&c.er===0&&c.wa===0&&!pr.draft;
  }).length;
  const s=n=>n!==1?'s':'';
  document.getElementById('chips').innerHTML=
    `<span class="chip">${t('pr_count',{n:total,s:s(total)})}</span>`+
    (failing?`<span class="chip er">${t('pr_failing',{n:failing})}</span>`:'')+
    (ready?`<span class="chip ok">${t('pr_ready',{n:ready,s:s(ready)})}</span>`:'');
}

// ── utils ─────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function relTime(iso){
  if(!iso) return '—';
  const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60) return `${s}s`;
  if(s<3600) return `${Math.floor(s/60)}min`;
  if(s<86400) return `${Math.floor(s/3600)}h`;
  return `${Math.floor(s/86400)}d`;
}

init();
</script>
</body>
</html>
