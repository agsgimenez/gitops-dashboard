services:
  gitops-dashboard:
    build: .
    ports:
      - "8081:80"
    # Option A: inject config via environment variables
    # environment:
    #   GD_PAT: "${GD_PAT:-}"
    #   GD_REPOS: "${GD_REPOS:-}"
    # Option B: mount your own config.js
    # volumes:
    #   - ./config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
