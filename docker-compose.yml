services:
  gitops-dashboard:
    build: .
    ports:
      - "8081:80"
    # config.js se monta desde el directorio padre (gitignored, nunca entra a la imagen)
    volumes:
      - ../config.js:/usr/share/nginx/html/config.js:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
